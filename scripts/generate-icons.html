<!DOCTYPE html>
<html>

<body>
    <canvas id="c192" width="192" height="192"></canvas>
    <canvas id="c512" width="512" height="512"></canvas>
    <script>
        function drawIcon(canvas) {
            const size = canvas.width;
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, size, size);

            // Rounded rect background
            const r = size * 0.1;
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(size - r, 0);
            ctx.quadraticCurveTo(size, 0, size, r);
            ctx.lineTo(size, size - r);
            ctx.quadraticCurveTo(size, size, size - r, size);
            ctx.lineTo(r, size);
            ctx.quadraticCurveTo(0, size, 0, size - r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            ctx.fillStyle = '#1a1a2e';
            ctx.fill();

            // Page dimensions
            const pageW = size * 0.45;
            const pageH = size * 0.55;
            const x = (size - pageW) / 2;
            const y = (size - pageH) / 2;
            const fold = size * 0.1;

            // Glow behind page
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = size * 0.12;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            // Page with folded corner
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + pageW - fold, y);
            ctx.lineTo(x + pageW, y + fold);
            ctx.lineTo(x + pageW, y + pageH);
            ctx.lineTo(x, y + pageH);
            ctx.closePath();
            const grad = ctx.createLinearGradient(x, y, x + pageW, y + pageH);
            grad.addColorStop(0, '#fffaf0');
            grad.addColorStop(0.4, '#ffe680');
            grad.addColorStop(1, '#ffcc00');
            ctx.fillStyle = grad;
            ctx.fill();

            // Reset shadow for fold
            ctx.shadowBlur = 0;

            // Fold triangle
            ctx.beginPath();
            ctx.moveTo(x + pageW - fold, y);
            ctx.lineTo(x + pageW - fold, y + fold);
            ctx.lineTo(x + pageW, y + fold);
            ctx.closePath();
            ctx.fillStyle = '#d4a800';
            ctx.fill();

            // Light rays from fold corner
            const rayOriginX = x + pageW - fold * 0.3;
            const rayOriginY = y + fold * 0.3;
            for (let i = 0; i < 6; i++) {
                const angle = Math.PI * 0.55 + (i * Math.PI * 0.12);
                const rayLen = size * 0.28;
                ctx.beginPath();
                ctx.moveTo(rayOriginX, rayOriginY);
                const ex = rayOriginX - Math.cos(angle) * rayLen;
                const ey = rayOriginY + Math.sin(angle) * rayLen;
                ctx.lineTo(ex, ey);
                ctx.lineWidth = size * 0.012;
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.25)';
                ctx.stroke();
            }
        }

        drawIcon(document.getElementById('c192'));
        drawIcon(document.getElementById('c512'));

        // Download links
        ['c192', 'c512'].forEach(id => {
            const c = document.getElementById(id);
            const a = document.createElement('a');
            a.download = id === 'c192' ? 'icon-192.png' : 'icon-512.png';
            a.href = c.toDataURL('image/png');
            a.textContent = 'Download ' + a.download;
            a.style.display = 'block';
            a.style.margin = '10px';
            document.body.appendChild(a);
        });
    </script>
</body>

</html>
